name: Sync counts from server card

# The fund count in this repo used to be hand-edited and went stale within
# weeks every time. This reads counts.funds (and the LP count, tier allowances
# and Pro price) from the live server card and commits any drift, so nobody has
# to remember to do it.

on:
  schedule:
    # Mondays 06:00 UTC, after the weekly profile refresh.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "README.md"
      - "server.json"
      - "examples/**"
      - "scripts/sync-counts.sh"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # On a PR, report drift instead of pushing a commit onto the branch.
      - name: Check for drift
        if: github.event_name == 'pull_request'
        run: scripts/sync-counts.sh --check

      - name: Sync counts
        if: github.event_name != 'pull_request'
        run: scripts/sync-counts.sh

      - name: Commit any drift
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet; then
            echo "Counts already current, nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync counts from live server card"
          git push

  # The repo's GitHub "About" blurb also carries a fund count, and it lives in
  # repo metadata rather than in a file, so a commit cannot fix it. GITHUB_TOKEN
  # cannot edit repo metadata by default: create a PAT with the "Administration:
  # write" repository permission and save it as the REPO_ADMIN_TOKEN secret to
  # enable this. Without the secret the step is skipped, not failed.
  about:
    runs-on: ubuntu-latest
    needs: sync
    if: github.event_name != 'pull_request'
    steps:
      - name: Update repository About description
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "REPO_ADMIN_TOKEN not set — skipping About update."
            exit 0
          fi
          FUNDS=$(curl -fsSL --max-time 30 \
            https://fundmomentum.vc/_api/well-known/mcp/server-card | jq -er '.counts.funds')
          # Round down to the nearest hundred, same as scripts/sync-counts.sh.
          FUNDS_H="$(( FUNDS / 100 * 100 ))+"
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}" \
            -f description="Fund Momentum MCP Server — VC intelligence for AI assistants. ${FUNDS_H} active VC funds, live investor signals, AI-powered startup matching."
